services:
  # ── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: buildstock-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - buildstock-net
    restart: unless-stopped

  # ── Frontend (React + Vite) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_APP_NAME=${VITE_APP_NAME}
        - VITE_ZITADEL_AUTHORITY=${VITE_ZITADEL_AUTHORITY}
        - VITE_ZITADEL_CLIENT_ID=${VITE_ZITADEL_CLIENT_ID}
        - VITE_APP_URL=${VITE_APP_URL}
    container_name: buildstock-frontend
    depends_on:
      - api
    networks:
      - buildstock-net
    restart: unless-stopped

  # ── Backend API (Node.js + Express) ─────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildstock-api
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_PORT=${APP_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASS=${MINIO_PASS}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost}
      - MINIO_PUBLIC_PORT=${MINIO_PUBLIC_PORT:-9003}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      storage:
        condition: service_started
    networks:
      - buildstock-net
    restart: unless-stopped

  # ── Database (PostgreSQL) ────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: buildstock-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buildstock-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache (Redis) ────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: buildstock-cache
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis-data:/data
    networks:
      - buildstock-net
    restart: unless-stopped

  # ── File Storage (MinIO) ─────────────────────────────────
  storage:
    image: minio/minio:latest
    container_name: buildstock-storage
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
      MINIO_SERVER_URL: "http://localhost:9003"
    volumes:
      - minio-data:/data
    ports:
      - "9003:9000"
      - "9002:9002"
    networks:
      - buildstock-net
    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  buildstock-net:
    driver: bridge
