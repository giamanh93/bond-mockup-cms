apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: buildstock-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_PORT
              value: "4000"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: DB_PASS
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: DB_NAME
            - name: DATABASE_URL
              value: "postgresql://buildstock_user:buildstock_pass_2026@db:5432/buildstock_db"
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: REDIS_PASS
            - name: REDIS_URL
              value: "redis://:redis_secret_pass@cache:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: JWT_SECRET
            - name: MINIO_ENDPOINT
              value: "storage"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: MINIO_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: buildstock-secrets
                  key: MINIO_PASS
            - name: MINIO_PUBLIC_URL
              value: "http://localhost/storage"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
